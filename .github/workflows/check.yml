name: Checks
on: [push, pull_request]
jobs:
  python:
    if: github.actor_id == '8305330' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check mac device tests scripts
      - run: uv run ruff format --check mac device tests scripts
      - run: uv run mypy
      - run: uv run python -m unittest discover -s tests -v
