[project]
name = "meural-hls"
version = "0.1.0"
description = "RAM-only live video streaming for Meural Canvas"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["mypy>=1.15,<2", "ruff>=0.11,<1"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["mac", "device", "tests", "scripts"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = true
warn_unused_ignores = true
explicit_package_bases = true
